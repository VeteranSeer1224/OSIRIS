name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install system dependencies (WeasyPrint)
        run: |
          sudo apt-get update
          sudo apt-get install -y libpango-1.0-0 libpangocairo-1.0-0
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,report,graph]"
      - name: Compile and test with coverage
        run: |
          python -m compileall -q .
          coverage run -m pytest -q
          coverage report -m
      - name: Static and security checks
        run: |
          ruff check .
          mypy
          bandit -q -r . -x ./.venv,./build,./osiris_evidence_platform.egg-info,./tests,./spiderfoot
          pip-audit
      - name: Build installable wheel
        run: python -m pip wheel . --no-deps --wheel-dir dist
      - name: Verify local evidence CLI surface
        run: |
          python osiris.py --json --help
          osiris --json demo conference --output /tmp/osiris-demo
