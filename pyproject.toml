[build-system]
requires = ["setuptools>=83"]
build-backend = "setuptools.build_meta"

[project]
name = "osiris-evidence-platform"
version = "0.1.0"
description = "Evidence-first OSINT investigation platform"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "cryptography==49.0.0",
  "jsonschema==4.26.0",
  "networkx==3.6.1",
  "pydantic==2.13.4",
  "requests==2.34.2",
  "tldextract==5.3.1",
]

[project.optional-dependencies]
report = ["weasyprint==69.0", "Pillow==12.3.0"]
graph = ["pyvis==0.3.2"]
ai = ["openai==2.44.0", "torch==2.13.0+cpu", "explabox==1.0.3"]
spiderfoot = ["lxml==6.1.1", "pyOpenSSL==26.3.0"]
dev = [
  "pytest==9.1.1",
  "coverage>=7.6",
  "openai==2.44.0",
  "ruff>=0.8",
  "mypy>=1.13",
  "bandit>=1.8",
  "pip-audit>=2.7",
]

[project.scripts]
osiris = "osiris:main"

[tool.setuptools]
py-modules = [
  "case_authorization",
  "chain_of_custody",
  "conference_demo",
  "evaluate",
  "evidence_capsule",
  "evidence_store",
  "explabox_wrapper",
  "explanation_card_build",
  "exports",
  "graph_build",
  "graph_utils",
  "legal_support",
  "osiris",
  "provenance",
  "release_policy",
  "report_build",
  "run_pipeline",
  "schema_validation",
  "sense_clean",
  "spiderfoot_runner",
  "xai_dashboard",
]

[tool.setuptools.packages.find]
include = ["mind*", "schemas*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [
  ".git",
  ".venv",
  "build",
  "osiris_evidence_platform.egg-info",
  "spiderfoot",
]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
warn_return_any = true
ignore_missing_imports = true
exclude = "(^build/|^spiderfoot/|^\\.venv/)"
files = [
  "*.py",
  "mind",
]
